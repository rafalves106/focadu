server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;

    # Upload de audio do Resumo Falado (Fase 35) passa por aqui - default do nginx e 1MB,
    # pequeno demais pra uma gravacao de voz de alguns minutos (bug real: upload de 1.46MB
    # rejeitado com 413 antes de chegar no backend, resposta nunca era criada).
    client_max_body_size 25m;

    # Fase 99: headers de seguranca em toda resposta. `add_header` de um `location` SUBSTITUI os do nivel de cima, entao
    # o bloco /lab/ repete os que cabem nele (mantenha os dois iguais). Sem `script-src` de proposito: uma CSP completa
    # para o app (Vite, fontes, Pyodide, microfone) so se fecha conferindo no navegador; aqui entram so as diretivas
    # que nao quebram nada (clickjacking, <base>, <object>, formulario externo). O microfone fica liberado
    # (Resumo Falado); camera, geolocalizacao e pagamento nao sao usados. HSTS vale porque o Cloudflare termina o HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Same-origin proxy pro backend - o SPA chama caminhos relativos (`/api/...`, ver
    # frontend/src/api/client.ts), entao o navegador nunca faz uma requisicao cross-origin de
    # verdade. Evita precisar de subdominio de API dedicado e de configurar CORS em producao.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Fase 87: laboratorio de codigo (public/lab/ -> /lab/). O codigo do aluno roda em Workers carregados daqui e
    # NAO pode chamar a API da Focada nem outra origem: `connect-src` so libera o caminho /lab/ (host-source
    # com caminho, sem esquema pra valer em http e https; $http_host e o host que o navegador usou). Mantenha
    # igual a `labContentSecurityPolicy` do vite.config.ts. `add_header` aqui substitui os do nivel acima.
    location /lab/ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src $http_host/lab/; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
        types {
            text/html html;
            text/javascript mjs js;
            application/wasm wasm;
            application/json json;
        }
        default_type application/octet-stream;
        # O Pyodide (9 MB de wasm) cai pra ~3,5 MB comprimido; kernel, initramfs e wheels ja sao compactados.
        gzip on;
        gzip_types application/wasm text/javascript application/json;
        gzip_min_length 1024;
        # Arquivo que falta e 404 de verdade - sem o fallback da SPA (devolveria o index.html com 200 no lugar do arquivo).
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
