server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;

    # Same-origin proxy pro backend - o SPA chama caminhos relativos (`/api/...`, ver
    # frontend/src/api/client.ts), entao o navegador nunca faz uma requisicao cross-origin de
    # verdade. Evita precisar de subdominio de API dedicado e de configurar CORS em producao.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
    }
}
