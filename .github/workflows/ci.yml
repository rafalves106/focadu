name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Focadu.slnx

      - name: Build
        run: dotnet build Focadu.slnx --no-restore --configuration Release

      - name: Test
        # CuratedContentAllFilesTests exclu­ído: depende de secret/curadoria/ (repo privado
        # focadu-secret), que este runner hospedado não tem acesso. Continua rodando no
        # runner self-hosted via `docker compose exec backend dotnet test` se precisar
        # validar isso de verdade - aqui só cobre o que é testável sem o conteúdo privado.
        run: dotnet test Focadu.slnx --no-build --configuration Release --filter "FullyQualifiedName!~CuratedContentAllFilesTests"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
