name: Deploy

# Dispara depois que o workflow CI (ci.yml) terminar num push em main - nao direto em `push`, pra
# nunca subir codigo que nao passou no build/teste. `workflow_run` so reage a eventos do branch
# default por padrao, mas o filtro abaixo (head_branch + conclusion) garante que so roda pra main e
# so quando a CI passou de verdade. Producao e o unico ambiente de deploy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, Linux, focadu-oracle]
    steps:
      - name: Resolver ambiente pela branch
        id: env
        run: |
          branch="${{ github.event.workflow_run.head_branch }}"
          if [ "$branch" = "main" ]; then
            echo "path=/home/ubuntu/focadu" >> "$GITHUB_OUTPUT"
            echo "compose_file=docker-compose.yml" >> "$GITHUB_OUTPUT"
            echo "frontend_port=5280" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$branch' nao mapeada para nenhum ambiente de deploy." >&2
            exit 1
          fi

      - name: Atualizar codigo (rafalves106/focadu)
        working-directory: ${{ steps.env.outputs.path }}
        run: |
          git fetch origin
          git reset --hard "origin/${{ github.event.workflow_run.head_branch }}"

      - name: Atualizar conteudo curado (rafalves106/focadu-secret)
        working-directory: ${{ steps.env.outputs.path }}/secret
        run: |
          git fetch origin
          git reset --hard origin/main

      # Fase 94: a importacao de dia pelo Painel de gestao roda o linter (Node) dentro do container do backend, que
      # monta secret/ como somente leitura - as dependencias do linter (so ajv, JS puro) sao instaladas aqui, no host,
      # por um container Node descartavel. Idempotente.
      - name: Dependencias do linter de dia
        working-directory: ${{ steps.env.outputs.path }}/secret/processo/scripts/linter-dia
        run: docker run --rm -v "$PWD:/linter" -w /linter node:22-alpine npm ci --omit=dev --no-audit --no-fund

      # Fase 100: backup do Postgres ANTES de subir a versao nova (e de a migration rodar no boot da Api). Falha fechado: se o
      # banco esta no ar e o dump sai vazio, o deploy para. Primeiro deploy (sem container) nao tem o que salvar. Arquivo so do
      # dono (umask 077: o dump tem hash de senha e dado pessoal); guarda os 14 ultimos. Copia fora da VM e criptografia
      # ainda nao existem (pendente: precisa de bucket e chave).
      - name: Backup do banco antes do deploy
        working-directory: ${{ steps.env.outputs.path }}
        run: |
          if ! docker compose -f ${{ steps.env.outputs.compose_file }} ps --status running --services | grep -qx postgres; then
            echo "Postgres nao esta rodando (primeiro deploy?): sem backup." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/backups"
          arq="$HOME/backups/focadu-pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
          docker compose -f ${{ steps.env.outputs.compose_file }} exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"' > "$arq"
          [ -s "$arq" ] || { echo "backup vazio; abortando o deploy" >&2; rm -f "$arq"; exit 1; }
          echo "Backup: $arq ($(du -h "$arq" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          ls -1t "$HOME"/backups/focadu-pre-deploy-*.dump | tail -n +15 | xargs -r rm -f

      - name: Subir stack Docker (build + up)
        working-directory: ${{ steps.env.outputs.path }}
        run: docker compose -f ${{ steps.env.outputs.compose_file }} up -d --build

      - name: Popular curriculo (idempotente - so faz algo em ambiente novo/DB vazio)
        working-directory: ${{ steps.env.outputs.path }}
        run: docker compose -f ${{ steps.env.outputs.compose_file }} exec -T backend dotnet Focadu.Api.dll seed

      - name: Healthcheck do frontend
        run: |
          port="${{ steps.env.outputs.frontend_port }}"
          ok=false
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$port/" || echo "000")
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 3
          done
          if [ "$ok" != "true" ]; then
            echo "Healthcheck falhou: frontend nao respondeu 200 em http://localhost:$port/ apos o deploy." >&2
            exit 1
          fi
          echo "Deploy OK - frontend respondendo em http://localhost:$port/"
