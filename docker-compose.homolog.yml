services:
  postgres:
    image: postgres:16-alpine
    container_name: focadu-hml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-focadu_hml}
      POSTGRES_USER: ${DB_USER:-focadu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD precisa ser definido no .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - focadu-hml-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-focadu} -d ${DB_NAME:-focadu_hml}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focadu-hml-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5292}:8080"
    environment:
      # SO do container roda em UTC por padrao - ver docker-compose.yml (producao) pro comentario
      # completo.
      TZ: America/Sao_Paulo
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Focadu: Host=postgres;Port=5432;Database=${DB_NAME:-focadu_hml};Username=${DB_USER:-focadu};Password=${DB_PASSWORD:?DB_PASSWORD precisa ser definido no .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY precisa ser definido no .env (minimo 32 caracteres)}
      Groq__ApiKey: ${GROQ_API_KEY:-}
      GitHub__Token: ${GITHUB_TOKEN:-}
      # Forgejo interno (Projeto Semanal) - ver docker-compose.yml (producao) pro comentario completo.
      Forgejo__BaseUrl: ${FORGEJO_BASE_URL:-http://forgejo:3000/api/v1/}
      Forgejo__AdminToken: ${FORGEJO_ADMIN_TOKEN:-}
      # Redefinicao de senha (Fase 41) - ver docker-compose.yml (producao) pro comentario completo.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Focadu}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-}
      CURATED_CONTENT_ROOT: /secret
    volumes:
      - ${SECRET_PATH:-./secret}:/secret:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: focadu-hml-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5290}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Forgejo interno (repositorios de Projeto Semanal) - instancia separada da de producao, mesmo
  # espirito de stack isolada por ambiente que postgres/backend/frontend ja seguem aqui.
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: focadu-hml-forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__SSH_PORT: 2232
      # Ver comentario em docker-compose.yml (producao) - sem isso, clone_url aponta pra porta
      # interna do container, nao a que o host expõe.
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_PORT:-3030}/
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "${FORGEJO_PORT:-3030}:3000"
      - "${FORGEJO_SSH_PORT:-2232}:22"
    volumes:
      - focadu-hml-forgejo-data:/data

volumes:
  focadu-hml-postgres-data:
  focadu-hml-forgejo-data:
