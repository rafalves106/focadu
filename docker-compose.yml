services:
  postgres:
    image: postgres:16-alpine
    container_name: focadu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-focadu}
      POSTGRES_USER: ${DB_USER:-focadu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD precisa ser definido no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - focadu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-focadu} -d ${DB_NAME:-focadu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focadu-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5282}:8080"
    environment:
      # SO do container roda em UTC por padrao - sem isso, DateTime.Now (ver SystemClock) cai no
      # dia UTC errado entre ~21h e 23h59 no horario de Brasilia, travando a liberacao diaria da
      # Daily (ver docs/fase-43/).
      TZ: America/Sao_Paulo
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Focadu: Host=postgres;Port=5432;Database=${DB_NAME:-focadu};Username=${DB_USER:-focadu};Password=${DB_PASSWORD:?DB_PASSWORD precisa ser definido no .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY precisa ser definido no .env (minimo 32 caracteres)}
      Groq__ApiKey: ${GROQ_API_KEY:-}
      GitHub__Token: ${GITHUB_TOKEN:-}
      # Forgejo interno (Projeto Semanal, ver secret/rascunhos/repositorios-gerenciados-projeto-
      # semanal.md) - endereco interno do container abaixo (rede padrao do Compose, DNS por nome
      # de servico), nunca exposto fora daqui. Ausente nao impede o app de subir - mesma decisao
      # de resiliencia do Groq/GitHub acima.
      Forgejo__BaseUrl: ${FORGEJO_BASE_URL:-http://forgejo:3000/api/v1/}
      Forgejo__AdminToken: ${FORGEJO_ADMIN_TOKEN:-}
      # Redefinicao de senha (Fase 41) - Smtp:Host ausente nao impede o app de subir, so o envio
      # do email falha (com erro claro) quando de fato chamado. Frontend:BaseUrl monta o link do
      # email - sem valor aqui, o backend cai no fallback de dev (localhost:5173), inutil em
      # producao: configure FRONTEND_BASE_URL no .env real.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Focadu}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-}
      # Contorna a busca por `.git` de CuratedContentPath (nao existe dentro do container) -
      # aponta direto pro bind mount do clone de focadu-secret abaixo. Ver
      # SeedWebSecurityCourseUseCase.CuratedContentPath.
      CURATED_CONTENT_ROOT: /secret
    volumes:
      # Bind mount, nao named volume: o conteudo curado e mantido atualizado por
      # `git reset --hard` no host (ver .github/workflows/deploy.yml nos dois repos), nao por
      # imagem. Read-only porque o backend so le, nunca escreve em secret/.
      - ${SECRET_PATH:-./secret}:/secret:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: focadu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5280}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Forgejo interno (repositorios de Projeto Semanal) - SQLite, sem join com o Postgres do domino
  # C# (app totalmente separada). Porta 3020 (host) = web/API, 2222 = SSH (git clone/push do
  # aluno) - 3000/3001/3002 (padrao Forgejo) ja estavam em uso por outros projetos neste host.
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: focadu-forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__SSH_PORT: 2222
      # Sem isso, o Forgejo deriva a URL de clone da porta INTERNA do container (3000), nao da
      # porta que o host expõe (${FORGEJO_PORT}) - confirmado ao vivo (18/09/2026): repositório
      # criado com clone_url apontando pra localhost:3000, inacessível de fora do container.
      # ponytail: aponta pra "localhost" porque o teste de hoje roda tudo na mesma máquina - se um
      # dia os alunos acessarem de fora deste host, precisa virar o endereço real alcançável por
      # eles (domínio/IP público ou túnel), não mais localhost.
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_PORT:-3020}/
      # false explicito (nao omitido): START_SSH_SERVER=true entra em conflito com o sshd externo
      # que a propria imagem ja sobe (confirmado ao vivo: "listen tcp :22: bind: address already
      # in use", 18/09/2026) - sshd externo da imagem ja serve git+ssh sozinho. Precisa ser
      # explicito porque o app.ini persiste no volume - so omitir a variavel nao reverte um valor
      # ja escrito numa subida anterior.
      FORGEJO__server__START_SSH_SERVER: "false"
      # Pula o wizard de instalacao interativo - a conta admin e o token sao criados via CLI
      # (docker exec + forgejo admin user create/generate-access-token), nao pela web.
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "${FORGEJO_PORT:-3020}:3000"
      - "${FORGEJO_SSH_PORT:-2222}:22"
    volumes:
      - focadu-forgejo-data:/data

volumes:
  focadu-postgres-data:
  focadu-forgejo-data:
